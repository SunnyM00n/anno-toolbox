[project]
name = "anno-toolbox"
version = "0.2.5"
description = "A toolbox for the Anno games (117, 1800, 2205, 2070, 1701, 1404): island editor, asset editor, viewer, UI editors, and the model, texture and sound exports"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }  # plus an additional permission for Ubisoft, LICENSE-UBISOFT.md
dependencies = []  # the light install: the standard library only (the file formats, the mod writing, the rdm and export commands)

[project.optional-dependencies]
textures = ["numpy>=1.26"]  # texture and model-texture export (DDS to PNG, EXR, HDR), glTF textures
gui = ["PySide6>=6.7", "moderngl>=5.10", "numpy>=1.26", "scipy>=1.11", "Pillow>=10"]  # the full Toolbox: the windows
dev = ["pytest>=8"]

[project.scripts]
"anno-toolbox" = "annotoolbox.suite.toolbox:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annotoolbox"]

[tool.hatch.build.targets.wheel.force-include]  # the readers' data files inside the package (paths.FORMAT_DATA)
"docs/formats/phoenix-schema.json" = "annotoolbox/formats/data/phoenix-schema.json"
"docs/formats/phoenix-schema-1800.json" = "annotoolbox/formats/data/phoenix-schema-1800.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
