name: tests
# actions pinned by commit, at the versions release.yml uses (Node 24); bump both files together
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
        extras: ["dev", "dev,gui"]  # the light install, and with the windows
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Qt needs a few system libraries on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[${{ matrix.extras }}]"
      - run: python -m pytest -q
      - run: python -m annotoolbox rdm layouts
  link-helper:
    # the link helper (native/livelink/README.md) builds with the runner's MSVC, as the release builds it
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The link helper builds
        shell: cmd
        run: native\livelink\build.cmd "%GITHUB_WORKSPACE%\out\live-link"
