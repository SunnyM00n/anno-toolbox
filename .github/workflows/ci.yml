name: tests
# actions pinned by commit, at the versions release.yml uses (Node 24); bump both files together
# Actions minutes are for releases only: this runs by hand (workflow_dispatch), never by itself.
on: workflow_dispatch
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
        extras: ["dev", "dev,gui"]  # the light install, and with the windows
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the system libraries Qt needs on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[${{ matrix.extras }}]"
      - run: python -m pytest -q
      - run: python -m annotoolbox rdm layouts
  link-helper:
    # the link helper (native/livelink/README.md) builds with the runner's MSVC, as the release builds it
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the link helper
        shell: cmd
        run: native\livelink\build.cmd "%GITHUB_WORKSPACE%\out\live-link"
  linux-build:
    # the Linux download (docs/installer.md, "Linux") builds on the oldest glibc the release supports, as the release
    # builds it: the program, its smoke start, the AppImage and its start, the tarball. Nothing is published.
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the system libraries Qt needs on Linux
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - run: python -m pip install -e ".[gui,music,convert]" pyinstaller==6.22.3 velopack==1.2.161
      - name: Install the installer's packer at the version of the Python module
        run: dotnet tool install vpk --version 1.2.161 --tool-path tools/vpk
      - run: python scripts/build_app.py --edition public --smoke --pack
  render-module:
    # the game look's Direct3D 12 module (native/d3d12/README.md): built for the stable ABI with the runner's MSVC,
    # its own test program on Windows' software rasteriser, then the tests with the module in place
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,gui]" nanobind==2.9.2
      - run: python scripts/build_native.py --test
      - run: python -m pytest -q tests/render/test_nativegpu.py tests/models/test_shadernative.py
